<script>
// 保存先：Supabase の kv テーブル（共有データ）＋ localStorage（この端末だけの情報）
(function () {
  var SB_URL = 'https://iqhcahunnqnviajbspdo.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxaGNhaHVubnFudmlhamJzcGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTU4NzcsImV4cCI6MjEwNDE5MTg3N30.Zppn6pcx8-6B08tZUAJQdkDVUzYGCWmC1ePPiiRsQys';
  var LOCAL_PREFIX = 'kakomon-tracker:local:';
  var TTL = 3000; // ミリ秒。この間の連続した読み込みは1回の通信にまとめる

  var H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
  var cache = null, cacheAt = 0, inflight = null, everOk = false;

  function banner(msg) {
    var id = 'sb-banner', el = document.getElementById(id);
    if (!msg) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = id;
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;' +
        'background:#A81B22;color:#fff;font:14px/1.5 system-ui,sans-serif;' +
        'padding:10px 14px;text-align:center';
      document.body.appendChild(el);
    }
    el.textContent = msg;
  }

  async function pull(force) {
    if (!force && cache && Date.now() - cacheAt < TTL) return cache;
    if (inflight) return inflight;
    inflight = (async function () {
      try {
        var res = await fetch(SB_URL + '/rest/v1/kv?select=key,value', { headers: H });
        if (!res.ok) throw new Error('read ' + res.status);
        var rows = await res.json();
        var next = {};
        rows.forEach(function (r) { next[r.key] = r.value; });
        cache = next; cacheAt = Date.now(); everOk = true;
        banner('');
        return cache;
      } catch (e) {
        banner('サーバーに接続できません。通信を確認してください。');
        throw e;
      } finally {
        inflight = null;
      }
    })();
    return inflight;
  }

  window.storage = {
    get: async function (key, shared) {
      if (!shared) {
        var v = localStorage.getItem(LOCAL_PREFIX + key);
        return v === null ? null : { value: v };
      }
      var c = await pull(false);
      return c[key] === undefined ? null : { value: c[key] };
    },

    set: async function (key, value, shared) {
      var str = String(value);
      if (!shared) {
        localStorage.setItem(LOCAL_PREFIX + key, str);
        return { value: str };
      }
      // 一度も読み込めていない状態で書くと、空データで上書きしてしまうため止める
      if (!everOk) { await pull(true); }
      var res = await fetch(SB_URL + '/rest/v1/kv', {
        method: 'POST',
        headers: {
          apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify({ key: key, value: str })
      });
      if (!res.ok) { banner('保存できませんでした。通信を確認してください。'); throw new Error('write ' + res.status); }
      if (cache) cache[key] = str;
      banner('');
      return { value: str };
    },

    delete: async function (key, shared) {
      if (!shared) { localStorage.removeItem(LOCAL_PREFIX + key); return true; }
      var res = await fetch(SB_URL + '/rest/v1/kv?key=eq.' + encodeURIComponent(key), {
        method: 'DELETE', headers: H
      });
      if (!res.ok) throw new Error('delete ' + res.status);
      if (cache) delete cache[key];
      return true;
    },

    // 「最新の入力を読み込む」などで最新を取りに行くため
    refresh: function () { return pull(true); }
  };

  pull(true).catch(function () {});
})();
</script>

.rec { padding: 16px 0; }

}

}

.wrow { padding: 14px 15px; }
.wrow.on { background: #FAFBFC; }
.wname {

}
.wpick { gap: 8px; }
.wbtn {

}

.ctrow { padding: 10px 11px; }

}

}

@media (max-width: 520px) {

/* --- 表から直接入力 --- */

.mx-click:active { transform: scale(.98); }

.review-badge {
  position: absolute;

  right: 5px;

  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 999px;

  function centerAverage(year, subject, full) {
    var row = CT_AVERAGE_PCT[String(year)] || null;
    if (!row || row[subject] === undefined || row[subject] === null) return null;
    var f = Number(full || 100);

  }

  function fmtAverage(v) {
    if (v === null || v === undefined || isNaN(Number(v))) return '';
    var n = Math.round(Number(v) * 100) / 100;
    return String(n.toFixed(2)).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
  }

  // 大学登録で選べる科目
  var UNI_SUBJECTS = ['英語', '国語', '数学', '化学', '物理', '世界史', '日本史'];

  // pre は 'n'（新規追加）か 'e'（編集）。同時に表示されるので分ける
  function subjectPickerHTML(pre, subjects) {
    subjects = subjects || [];
    var rows = UNI_SUBJECTS.map(function (name, i) {
      var cur = subjects.filter(function (s) { return s.name === name; })[0];
      return '<label class="ctrow' + (cur ? ' on' : '') + '">' +
        '<input type="checkbox" data-us="' + pre + '-' + i + '"' + (cur ? ' checked' : '') + '>' +
        '<span class="ctn">' + esc(name) + '</span>' +
        '<input class="ctp" type="number" inputmode="numeric" data-uf="' + pre + '-' + i + '" ' +
          'placeholder="満点" value="' + (cur ? cur.full : '') + '">' +
      '</label>';
    }).join('');
    var extras = subjects.filter(function (s) { return UNI_SUBJECTS.indexOf(s.name) < 0; });

      '<div class="ctlist compact-subjects">' + rows + '</div></div>' +
      '<div class="field"><label>その他の科目（1行ずつ　科目名 満点）</label>' +
      '<textarea id="' + pre + '-text" rows="3" placeholder="生物 100&#10;政治経済 100&#10;小論文 60">' + esc(subjectsToText(extras)) + '</textarea></div>' +
      '<p class="note" style="margin-top:-4px">科目ごとの目標点は、記録表の科目名から設定できます。</p>';
  }

  function readSubjectPicker(pre) {
    var out = [];
    var old = (pre === 'e' && S.draft && S.draft.subjects) ? S.draft.subjects : [];
    root.querySelectorAll('[data-us^="' + pre + '-"]').forEach(function (box) {
      if (!box.checked) return;
      var i = Number(box.getAttribute('data-us').split('-')[1]);
      var fv = root.querySelector('[data-uf="' + pre + '-' + i + '"]');
      var prev = old.filter(function (x) { return x.name === UNI_SUBJECTS[i]; })[0];
      out.push({
        name: UNI_SUBJECTS[i],
        full: fv && fv.value !== '' ? Number(fv.value) : 100,
        targets: prev && prev.targets ? Object.assign({}, prev.targets) : {}
      });
    });
    var ta = root.querySelector('#' + pre + '-text');
    if (ta) parseSubjects(ta.value || '').forEach(function (sub) {
      if (!out.some(function (x) { return x.name === sub.name; })) {
        var prev = old.filter(function (x) { return x.name === sub.name; })[0];
        sub.targets = prev && prev.targets ? Object.assign({}, prev.targets) : {};
        out.push(sub);
      }
    });
    return out;
  }

  var KINDS = { center: '共通テスト', first: '第一志望', sub: '併願校' };
  function kindOf(label) {
    if (label === CENTER_NAME) return 'center';
    var u = S.unis.filter(function (x) { return uniLabel(x) === label; })[0];
    return (u && u.kind) ? u.kind : 'sub';
  }
  function kindRank(k) { return k === 'center' ? 0 : (k === 'first' ? 1 : 2); }

  // 第一志望は10年分、それ以外は5年分を最初から出す
  function yearsFor(kind) {
    var n = kind === 'first' ? 10 : 5, out = [];
    for (var i = 0; i < n; i++) out.push(String(LATEST_YEAR - i));
    return out;
  }

  function centerUni() {
    return { id: CENTER_ID, name: CENTER_NAME, faculty: '', kind: 'center', subjects: S.ct };
  }

  function blankForm() {
    var d = new Date();
    return {
      uniKey: '', univ: '', faculty: '', year: '',
      subjKey: '', subject: '',
      score: '', full: '100', pass: '', memo: '',
      date: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
    };
  }

  /* ---------- storage ---------- */
  async function sGet(key, shared) {
    try { var r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch (e) { return null; }
  }
  async function sSet(key, val, shared) { return await window.storage.set(key, val, shared); }
  function parse(v, f) { if (!v) return f; try { return JSON.parse(v); } catch (e) { return f; } }

  async function hashPin(pin) {
    var data = new TextEncoder().encode(String(pin));
    var hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function validPin(pin) { return /^\d{4}$/.test(String(pin || '')); }

  async function loadRoster() {
    S.roster = parse(await sGet('roster', true), []);
    S.archived = parse(await sGet('archived-roster', true), []);
  }
  function unisKey(sid) { return 'unis:' + sid; }
  async function loadUnis(sid) {
    sid = sid || (S.me ? S.me.id : '');
    S.editSid = sid;
    S.unis = sid ? parse(await sGet(unisKey(sid), true), []) : [];
  }
  async function saveUnis(list) {
    if (!S.editSid) return;
    await sSet(unisKey(S.editSid), JSON.stringify(list), true);
    S.unis = list;
  }

    if (!S.me) return;
    await sSet('ct:' + S.me.id, JSON.stringify(subs), true);

  }

    var id = await sGet('me', false);

    // 旧データの生徒は次回、最初の4桁PINを設定してから入る

    if (me) S.authSid = me.id;
    if (id) await sSet('me', '', false);

  async function safetyBackup(reason, sid) {
    try {
      var backups = parse(await sGet('safety-backups', true), []);
      var snap = { at: Date.now(), reason: reason || '変更前', sid: sid || '', roster: parse(await sGet('roster', true), []), seminar: parse(await sGet('seminar', true), []) };

      if (backups.length > 30) backups = backups.slice(0, 30);

    } catch (e) {}

  /* ---------- helpers ---------- */
  function pct(r) { return r.full ? Math.round((r.score / r.full) * 1000) / 10 : 0; }

  function diff(r) { return (r.pass === null || r.pass === undefined || r.pass === '') ? null : r.score - r.pass; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) { if (!iso) return ''; var p = iso.split('-'); return p[1] + '/' + p[2]; }

  function parseSubjects(text) {

      var line = raw.trim();
      if (!line) return null;
      var parts = line.split(/[,\t、]+|\s+/).filter(function (p) { return p !== ''; });
      var name = parts[0];
      var full = parts[1] !== undefined && !isNaN(Number(parts[1])) ? Number(parts[1]) : 100;
      return { name: name, full: full, targets: {} };
    }).filter(Boolean);

  }

  function subjectsToText(subs) {

  /* ---------- record card ---------- */
  function recHTML(r, delKey) {
    var p = pct(r), lp = linePct(r), d = diff(r);
    var reached = d !== null && d >= 0;
    var color = d === null ? '#8E8B84' : (reached ? 'var(--reach)' : 'var(--short)');
    var line = lp === null ? '' : '<div class="line" style="left:' + Math.min(lp, 100) + '%" data-label="' + r.pass + '点"></div>';
    var verdict = d === null
      ? '<div class="verdict na">目標点は未登録</div>'
      : (reached
        ? '<div class="verdict ok">目標点 +' + d + '点 ／ 到達</div>'
        : '<div class="verdict ng">目標点 ' + d + '点 ／ あと' + Math.abs(d) + '点</div>');

    return '<div class="rec">' +
      '<div class="rec-top">' +
        '<div><div class="rec-name">' + esc(r.univ) + (r.faculty ? ' ' + esc(r.faculty) : '') + '</div>' +
        '<div class="rec-meta">' + esc(r.year) + (r.year ? '年度 ・ ' : '') + esc(r.subject) +
          (r.date ? ' ・ ' + fmtDate(r.date) : '') + '</div></div>' +
        '<div class="rec-score">' + r.score + '<small>/' + r.full + '</small><br><small>' + p + '%</small></div>' +
      '</div>' +
      '<div class="track"><div class="fill" style="width:' + Math.min(p, 100) + '%;background:' + color + '"></div>' + line + '</div>' +
      verdict +
      (r.reviewed ? '<div class="note" style="margin-top:6px;color:#2563EB;font-weight:700">☻ 復習済</div>' : '') +
      (r.memo ? '<div class="note" style="margin-top:6px">' + esc(r.memo) + '</div>' : '') +
      (delKey !== undefined ? '<button class="rec-del" data-del="' + delKey + '">この記録を削除</button>' : '') +
    '</div>';
  }

  /* ---------- student ---------- */
  /* ---------- 年度 × 科目 のマス目 ---------- */
  function groupByUni(recs) {
    var map = {}, order = [];
    recs.forEach(function (r) {
      var k = r.univ + '\u0000' + (r.faculty || '');
      if (!map[k]) { map[k] = { label: r.univ + (r.faculty ? ' ' + r.faculty : ''), recs: [] }; order.push(k); }
      map[k].recs.push(r);
    });
    return order.map(function (k) { return map[k]; })
      .map(function (g) { g.kind = kindOf(g.label); return g; })
      .sort(function (a, b) { return kindRank(a.kind) - kindRank(b.kind); });
  }

  function totalStatus(total, target, minimum) {
    if (target === null || target === undefined || target === '' ||
        minimum === null || minimum === undefined || minimum === '') return 'neutral';
    var t = Number(total) >= Number(target);
    var m = Number(total) >= Number(minimum);
    return t && m ? 'blue' : (t || m ? 'yellow' : 'red');
  }

  function yearlyMinimum(reg, year) {
    if (!reg || !reg.minimums) return null;
    var v = reg.minimums[String(year)];
    return (v === null || v === undefined || v === '') ? null : Number(v);
  }

  function subjectDisplayName(name) {
    var m = {
      '英語リーディング':'英語R', '英語リスニング':'英語L',
      '数学I・A':'数学ⅠA', '数学II・B・C':'数学ⅡBC',
      '物理基礎':'物基', '化学基礎':'化基', '生物基礎':'生基', '地学基礎':'地基',
      '世界史探究':'世界史', '日本史探究':'日本史', '地理探究':'地理',
      '公共，倫理':'公共倫理', '公共，政治・経済':'公共政経', '情報I':'情報Ⅰ'
    };
    return m[name] || name;
  }

  function subjectTarget(reg, subject) {
    if (!reg || !reg.subjects) return null;
    var sb = reg.subjects.filter(function (x) { return x.name === subject; })[0];
    if (!sb) return null;
    if (sb.target !== null && sb.target !== undefined && sb.target !== '') return Number(sb.target);
    // 旧「年度別目標点」データが残っている場合は、最新年度の値を暫定的に引き継ぐ
    if (sb.targets) {
      var ys = Object.keys(sb.targets).sort(function (a, b) { return String(b).localeCompare(String(a)); });
      for (var i = 0; i < ys.length; i++) {
        var v = sb.targets[ys[i]];
        if (v !== null && v !== undefined && v !== '') return Number(v);
      }
    }
    return null;
  }

  function matrixHTML(label, recs, kind) {
    kind = kind || kindOf(label);

    var reg = label === CENTER_NAME ? centerUni()
      : S.unis.filter(function (u) { return uniLabel(u) === label; })[0];
    var subs = reg ? reg.subjects.map(function (s) { return s.name; }) : [];
    recs.forEach(function (r) { if (subs.indexOf(r.subject) < 0) subs.push(r.subject); });
    if (!subs.length) {
      var noSubsOpen = !!S.mxOpen[label];
      return '<div class="mx"><div class="mx-h" data-mxtoggle="' + esc(label) + '" data-open="' + (noSubsOpen ? '1' : '0') + '">' + esc(label) +
        '<em>' + KINDS[kind] + '</em></div>' +
        (noSubsOpen ? '<p class="note" style="padding:14px">科目が未登録です。</p>' : '') + '</div>';
    }

    var years = yearsFor(kind);
    recs.forEach(function (r) { var y = r.year || '—'; if (years.indexOf(y) < 0) years.push(y); });
    years.sort(function (a, b) { return String(b).localeCompare(String(a)); });

    var done = 0;
    var head = '<tr><th class="cnr">年度</th>' + subs.map(function (s) {
      var st = subjectTarget(reg, s);
      var editing = S.targetQuick && S.targetQuick.label === label && S.targetQuick.subject === s;
      if (editing) {
        return '<th class="mx-target-head-edit" title="' + esc(s) + '">' +
          '<div>' + esc(subjectDisplayName(s)) + '</div>' +
          '<div class="qbox" style="margin-top:5px">' +
            '<input class="qscore" id="qs-target" type="number" inputmode="numeric" placeholder="目標" value="' + esc(S.targetQuick.value || '') + '">' +
            '<div class="qactions"><button class="qsave" id="qs-save">保存</button><button class="qcancel" id="qs-cancel">×</button></div>' +
          '</div></th>';
      }
      return '<th title="' + esc(s) + '">' + esc(subjectDisplayName(s)) +
        '<button class="mx-target-btn" data-qsopen="1" data-qslabel="' + esc(label) + '" data-qssubject="' + esc(s) + '">' +
        (st === null ? '＋目標' : '目標 ' + st) + '</button></th>';
    }).join('') + '<th class="mx-total-head">合計</th></tr>';

    var body = years.map(function (y) {
      var latestBySubject = {};
      var cells = subs.map(function (s) {
        var hit = recs.filter(function (r) { return (r.year || '—') === y && r.subject === s; });
        var q = S.quick && S.quick.label === label && S.quick.year === y && S.quick.subject === s;
        var target = subjectTarget(reg, s);
        if (q) {
          return '<td class="mx-quick">' +
            '<div class="qbox">' +
              '<input class="qscore" id="q-score" type="number" inputmode="numeric" placeholder="点数" value="' + esc(S.quick.score || '') + '">' +
              '<div class="qmeta">/' + esc(S.quick.full) + '点</div>' +
              '<label class="qreview"><input id="q-reviewed" type="checkbox"' + (S.quick.reviewed ? ' checked' : '') + '>復習できた</label>' +
              '<div class="qactions"><span class="qmeta">外をタップで自動保存</span><button class="qcancel" id="q-cancel">×</button></div>' +
            '</div>' +
          '</td>';
        }
        if (!hit.length) {
          return '<td class="mx-none mx-click" data-qopen="1" data-qlabel="' + esc(label) + '" data-qyear="' + esc(y) + '" data-qsubject="' + esc(s) + '" title="ここから点数を入力"><span class="qplus">＋</span></td>';
        }
        done++;
        var r = hit[hit.length - 1];
        latestBySubject[s] = r;
        var avg = kind === 'center' ? centerAverage(y, s, r.full) : null;
        var cls, tip, avgLine = '';
        if (kind === 'center' && avg !== null) {
          if (Number(r.score) < Number(avg)) cls = 'mx-subj-ng';
          else if (target !== null && Number(r.score) >= Number(target)) cls = 'mx-subj-ok';
          else cls = 'mx-subj-mid';
          tip = '平均 ' + fmtAverage(avg) + '点' + (target === null ? '／目標点は未登録' : '／目標 ' + target + '点');
          avgLine = '<small class="mx-avg">平均 ' + fmtAverage(avg) + '</small>';
        } else {
          cls = target === null ? 'mx-na' : (Number(r.score) >= target ? 'mx-subj-ok' : 'mx-subj-ng');
          tip = target === null ? '目標点は未登録' : (Number(r.score) >= target ? '目標点達成（' + target + '点）' : '目標点未達（' + target + '点）');
        }
        return '<td class="' + cls + ' mx-click" title="' + esc(tip) + '／クリックで点数を編集" data-qopen="1" data-qlabel="' + esc(label) + '" data-qyear="' + esc(y) + '" data-qsubject="' + esc(s) + '">' +
          '<b>' + r.score + '</b><span>/' + r.full + '</span>' + avgLine +
          (r.reviewed ? '<span class="review-badge" title="復習済">☻</span>' : '') +
          '</td>';
      }).join('');

      var entered = Object.keys(latestBySubject).length;
      var total = Object.keys(latestBySubject).reduce(function (sum, k) { return sum + Number(latestBySubject[k].score || 0); }, 0);
      var fullTotal = reg && reg.subjects ? reg.subjects.reduce(function (sum, sb) { return sum + Number(sb.full || 0); }, 0) : 0;
      var minimum = yearlyMinimum(reg, y);
      var target = reg && reg.target !== null && reg.target !== undefined && reg.target !== '' ? Number(reg.target) : null;
      var tq = S.totalQuick && S.totalQuick.label === label && S.totalQuick.year === y;

      var totalCell;
      if (tq) {
        totalCell = '<td class="mx-total mx-total-edit">' +
          '<div class="qbox">' +
            '<input class="qscore" id="qt-min" type="number" inputmode="numeric" placeholder="最低点" value="' + esc(S.totalQuick.value || '') + '">' +
            '<div class="qmeta">最低点</div>' +
            '<div class="qactions"><button class="qsave" id="qt-save">保存</button><button class="qcancel" id="qt-cancel">×</button></div>' +
          '</div></td>';
      } else {
        var st;
        var centerAvgTotal = null;
        if (kind === 'center' && entered) {
          var avgParts = Object.keys(latestBySubject).map(function (sn) {
            var rr = latestBySubject[sn];
            return centerAverage(y, sn, rr.full);
          });
          if (avgParts.length && avgParts.every(function (v) { return v !== null; })) {
            centerAvgTotal = Math.round(avgParts.reduce(function (a, v) { return a + Number(v); }, 0) * 100) / 100;
          }
        }
        if (!entered) st = 'neutral';
        else if (kind === 'center' && centerAvgTotal !== null) {
          st = Number(total) < Number(centerAvgTotal) ? 'red' : ((target !== null && Number(total) >= Number(target)) ? 'blue' : 'yellow');
        } else if (kind === 'center') st = target === null ? 'neutral' : (Number(total) >= Number(target) ? 'blue' : 'red');
        else st = totalStatus(total, target, minimum);
        var cls2 = st === 'blue' ? ' total-blue' : (st === 'yellow' ? ' total-yellow' : (st === 'red' ? ' total-red' : ' total-neutral'));
        var totalMain = entered ? '<b>' + total + '</b>' + (fullTotal ? '<span>/' + fullTotal + '</span>' : '') : '<span class="total-empty">—</span>';
        if (kind === 'center' && centerAvgTotal !== null) totalMain += '<small class="mx-avg">平均 ' + fmtAverage(centerAvgTotal) + '</small>';
        var minLine = kind === 'center' ? '' : (minimum === null
          ? '<button class="total-min-add" data-tqopen="1" data-tqlabel="' + esc(label) + '" data-tqyear="' + esc(y) + '">＋ 最低点</button>'
          : '<button class="total-min-show" data-tqopen="1" data-tqlabel="' + esc(label) + '" data-tqyear="' + esc(y) + '">最低 ' + minimum + '</button>');
        var targetLine = target === null ? '' : '<i>目標 ' + target + '</i>';
        totalCell = '<td class="mx-total' + cls2 + '">' + totalMain + targetLine + minLine +
          (entered && entered < subs.length ? '<small>' + entered + '/' + subs.length + '科目</small>' : '') + '</td>';
      }

      return '<tr><th class="mx-y">' + esc(y) + '</th>' + cells + totalCell + '</tr>';
    }).join('');

    var total = years.length * subs.length;
    var targetNote = reg && reg.target !== null && reg.target !== undefined && reg.target !== ''
      ? '　目標合計 ' + esc(reg.target) + '点' : '　目標点未登録';
    var isOpen = !!S.mxOpen[label];
    return '<div class="mx">' +
      '<div class="mx-h" data-mxtoggle="' + esc(label) + '" data-open="' + (isOpen ? '1' : '0') + '">' + esc(label) + '<em>' + KINDS[kind] + '</em></div>' +
      (isOpen ? '<div class="mx-scroll"><table class="mx-t"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="mx-f">' + done + ' / ' + total + ' マス済み　残り' + (total - done) + targetNote + '</div>' : '') +
    '</div>';
  }

  // 自由入力で記録した大学・科目を一覧に残す
  async function ensureRegistered(rec) {
    if (!rec.univ || rec.univ === CENTER_NAME) return;
    var fresh = parse(await sGet(unisKey(S.me.id), true), []);
    var fac = rec.faculty || '';
    var u = fresh.filter(function (x) { return x.name === rec.univ && (x.faculty || '') === fac; })[0];
    var changed = false;

    if (!u) {
      u = {
        id: 'u' + Date.now().toString(36) + Math.floor(Math.random() * 999).toString(36),
        name: rec.univ, faculty: fac, kind: 'sub', target: null, minimums: {}, subjects: []
      };
      fresh.push(u);
      changed = true;
    }
    if (rec.subject && !u.subjects.some(function (s) { return s.name === rec.subject; })) {
      u.subjects.push({ name: rec.subject, full: rec.full, targets: {} });
      changed = true;
    }
    if (changed) {
      await sSet(unisKey(S.me.id), JSON.stringify(fresh), true);
      S.unis = fresh;
    }
  }

          '<button class="barlink" data-delu="' + esc(u.id) + '">一覧から消す</button></p>' +
      '</div>';
    }).join('');
    var editing = S.editUni ? editUniHTML(findUni(S.editUni)) : '';

  function seminarModeTabs(which) {
    var key = which === 'teacher' ? S.teacherPanel : S.studentPanel;
    var attr = which === 'teacher' ? 'data-teacher-panel' : 'data-student-panel';
    return '<div class="mode-switch">' +
      '<button ' + attr + '="past" aria-selected="' + (key === 'past') + '">過去問</button>' +
      '<button ' + attr + '="seminar" aria-selected="' + (key === 'seminar') + '">英語テストゼミ</button>' +
    '</div>';
  }

  function seminarRoundInfo(roundNo) {
    return S.seminar.filter(function (x) { return Number(x.round) === Number(roundNo); })[0] || null;
  }

  function seminarRanking(round) {
    if (!round) return [];
    var full1 = Number(round.full1 || 0), full2 = Number(round.full2 || 0), fullTotal = full1 + full2;
    var rows = S.roster.map(function (st) {
      var sc = (round.scores || {})[st.id] || {};
      var p1 = sc.p1 === '' || sc.p1 === undefined || sc.p1 === null ? null : Number(sc.p1);
      var p2 = sc.p2 === '' || sc.p2 === undefined || sc.p2 === null ? null : Number(sc.p2);
      var total = (p1 === null || p2 === null) ? null : p1 + p2;
      var pct = (total === null || !fullTotal) ? null : (total / fullTotal * 100);
      return { st: st, p1: p1, p2: p2, total: total, full1: full1, full2: full2, fullTotal: fullTotal, pct: pct };
    });
    var ranked = rows.filter(function (x) { return x.pct !== null; }).sort(function (a,b) { return b.pct-a.pct; });
    var lastPct = null, lastRank = 0;
    ranked.forEach(function (x, i) {
      var key = Math.round(x.pct * 10000) / 10000;
      if (lastPct === null || key !== lastPct) { lastRank = i + 1; lastPct = key; }
      x.rank = lastRank;
    });
    rows.filter(function (x) { return x.pct === null; }).forEach(function (x) { x.rank = null; ranked.push(x); });
    return ranked;
  }

  function pct1(v) { return v === null || v === undefined ? '—' : (Math.round(Number(v) * 10) / 10) + '%'; }

  function seminarPartPct(score, full) {
    if (score === null || score === undefined || score === '' || !Number(full)) return null;
    return Number(score) / Number(full) * 100;
  }

  function seminarStudentSeries(sid, rounds) {
    return rounds.map(function (r) {
      var sc = (r.scores || {})[sid] || {};
      var p1 = sc.p1 === '' || sc.p1 === undefined || sc.p1 === null ? null : Number(sc.p1);
      var p2 = sc.p2 === '' || sc.p2 === undefined || sc.p2 === null ? null : Number(sc.p2);
      return {
        round: Number(r.round),
        humanities: seminarPartPct(p1, Number(r.full1 || 0)),
        science: seminarPartPct(p2, Number(r.full2 || 0))
      };
    });
  }

  function avgSeries(series, key) {
    var vals = series.map(function (x) { return x[key]; }).filter(function (x) { return x !== null && x !== undefined; });
    return vals.length ? vals.reduce(function (a,b) { return a+b; }, 0) / vals.length : null;
  }

  function seminarLineChartHTML(series) {
    var W = 640, H = 260, L = 44, R = 18, T = 18, B = 38;
    var iw = W - L - R, ih = H - T - B;
    var n = Math.max(series.length, 2);
    function x(i) { return L + (iw * i / (n - 1)); }
    function y(v) { return T + ih * (1 - Number(v) / 100); }
    function lineFor(key) {
      var segs = [], cur = [];
      series.forEach(function (d, i) {
        var v = d[key];
        if (v === null || v === undefined) {
          if (cur.length) { segs.push(cur); cur = []; }
        } else cur.push(x(i).toFixed(1) + ',' + y(v).toFixed(1));
      });
      if (cur.length) segs.push(cur);
      return segs;
    }
    var grids = [0,25,50,75,100].map(function (v) {
      var yy = y(v).toFixed(1);
      return '<line class="grid" x1="' + L + '" y1="' + yy + '" x2="' + (W-R) + '" y2="' + yy + '"></line>' +
        '<text class="axis-text" x="' + (L-8) + '" y="' + (Number(yy)+3) + '" text-anchor="end">' + v + '%</text>';
    }).join('');
    var xlabels = series.map(function (d,i) {
      return '<text class="axis-text" x="' + x(i).toFixed(1) + '" y="' + (H-13) + '" text-anchor="middle">' + d.round + '</text>';
    }).join('');
    function lines(key, cls) {
      return lineFor(key).map(function (pts) { return '<polyline class="' + cls + '-line" points="' + pts.join(' ') + '"></polyline>'; }).join('');
    }
    function dots(key, cls) {
      return series.map(function (d,i) {
        var v=d[key]; if (v===null || v===undefined) return '';
        return '<circle class="' + cls + '-dot" cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="4"><title>第' + d.round + '回 ' + (cls==='humanities'?'文系':'理系') + ' ' + pct1(v) + '</title></circle>';
      }).join('');
    }
    return '<svg class="seminar-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="文系と理系の正答率推移">' +
      grids + xlabels +
      lines('humanities','humanities') + lines('science','science') +
      dots('humanities','humanities') + dots('science','science') +
    '</svg>';
  }

  function studentSeminarView() {
    var sid = S.me.id;
    var rounds = S.seminar.slice().sort(function (a,b) { return Number(a.round)-Number(b.round); });
    var pcts = [];
    var rows = rounds.map(function (r) {
      var ranking = seminarRanking(r);
      var mine = ranking.filter(function (x) { return x.st.id === sid; })[0] || {};
      var completed = mine.pct !== null && mine.pct !== undefined;
      if (completed) pcts.push(mine.pct);
      var cls = mine.rank === 1 ? ' gold' : (mine.rank === 2 ? ' silver' : '');
      var medal = mine.rank === 1 ? '<span class="medal gold">1位</span>' : (mine.rank === 2 ? '<span class="medal silver">2位</span>' : '');
      return '<div class="seminar-row' + cls + '">' +
        '<div class="seminar-round">第' + r.round + '回<small>' + esc(fmtDate(r.date)) + '</small></div>' +
        '<div class="seminar-breakdown">文系 <b>' + (mine.p1 === null ? '—' : mine.p1) + '</b>/' + Number(r.full1 || 0) + '　理系 <b>' + (mine.p2 === null ? '—' : mine.p2) + '</b>/' + Number(r.full2 || 0) +
          (completed ? '<br>合計 ' + mine.total + '/' + mine.fullTotal : '') + '</div>' +
        '<div class="seminar-score"><b>' + (completed ? pct1(mine.pct) : '—') + '</b>' + medal + '</div>' +
      '</div>';
    }).join('');
    var ownAvg = pcts.length ? pcts.reduce(function(a,b){return a+b;},0)/pcts.length : null;
    var latest = pcts.length ? pcts[pcts.length-1] : null;
    var series = seminarStudentSeries(sid, rounds);
    var humAvg = avgSeries(series, 'humanities');
    var sciAvg = avgSeries(series, 'science');
    var gap = (humAvg === null || sciAvg === null) ? null : humAvg - sciAvg;
    var gapLabel = gap === null ? '—' : ((gap > 0 ? '+' : '') + (Math.round(gap*10)/10) + 'pt');
    var viewSwitch = '<div class="seminar-view-switch">' +
      '<button data-seminar-view="scores" aria-selected="' + (S.studentSeminarView === 'scores') + '">点数</button>' +
      '<button data-seminar-view="graph" aria-selected="' + (S.studentSeminarView === 'graph') + '">グラフ</button>' +
    '</div>';
    var scoreView = '<div class="seminar-summary"><div class="seminar-stat"><b>' + pct1(ownAvg) + '</b><span>10回の平均正答率</span></div>' +
      '<div class="seminar-stat"><b>' + pct1(latest) + '</b><span>最新回の正答率</span></div></div>' +
      '<div class="seminar-list">' + rows + '</div>' +
      '<p class="note" style="margin-top:12px">1位は金、2位は銀で表示します。3位以下の順位は生徒画面には表示しません。</p>';
    var graphView = '<div class="seminar-chart-card">' +
      '<div class="seminar-chart-title"><b>文系・理系 正答率推移</b><div class="seminar-legend"><span class="humanities"><i></i>文系</span><span class="science"><i></i>理系</span></div></div>' +
      '<div class="seminar-chart-wrap">' + seminarLineChartHTML(series) + '</div>' +
      '<div class="seminar-chart-stats">' +
        '<div class="seminar-chart-stat"><b>' + pct1(humAvg) + '</b><span>文系平均</span></div>' +
        '<div class="seminar-chart-stat"><b>' + pct1(sciAvg) + '</b><span>理系平均</span></div>' +
        '<div class="seminar-chart-stat"><b>' + gapLabel + '</b><span>文系 − 理系</span></div>' +
      '</div></div>';
    return '<div class="wrap">' + seminarModeTabs('student') +
      '<div class="seminar-head"><div><h2>英語テストゼミ</h2><p>毎週、文系長文・理系長文の2題。正答率で推移を確認できます。</p></div></div>' +
      viewSwitch +
      (S.studentSeminarView === 'graph' ? graphView : scoreView) +
      '<p class="note" style="margin-top:14px"><button class="barlink" id="switchme">別の名前に切り替える</button></p>' +
    '</div>';
  }

        '<div class="seminar-ranking">' + rows + '</div>' +
      '</div>' +
      '<p class="note" style="margin-top:10px">講師側は全順位を表示。1位＝金、2位＝銀。正答数を変更すると自動保存します。</p>' +

            '<div class="field"><label>確認のため「リセット」と入力してください</label>' +
            '<input id="rs-word" placeholder="リセット" autocomplete="off"></div>' +
            '<div class="field"><label>新しい暗証番号（4桁以上の数字）</label>' +
            '<input id="rs-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>' +
            '<div class="row2">' +
              '<button class="btn sm" id="rs-go">暗証番号を変更する</button>' +
              '<button class="btn sm ghost" id="rs-cancel">やめる</button>' +
            '</div>' +
            '<p class="note" style="margin:12px 0 0">記録や大学の登録は消えません。変更されるのは暗証番号だけです。</p>' +
          '</div>'
        : (S.pinExists ? '<p class="note" style="margin-top:14px"><button class="barlink" id="rs-open">暗証番号を忘れた場合</button></p>' : '');

      return '<div class="wrap">' +
        '<div class="sec-title">' + (S.pinExists ? '暗証番号を入力' : '暗証番号を設定') + '</div>' +
        '<div class="card">' +
          '<div class="field"><label>4桁以上の数字</label>' +
          '<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>' +
          '<button class="btn wide" id="pinok">' + (S.pinExists ? '開く' : '設定して開く') + '</button>' +
        '</div>' +
        resetBlock +
        '<p class="note" style="margin-top:12px">生徒の入力画面と分けるための簡易的な鍵です。厳密なセキュリティではありません。</p>' +
      '</div>';
    }
    if (S.teacherPanel === 'seminar') return teacherSeminarView();
    if (S.tTab === 'unis') return uniView();

    var allFlat = [];
    S.roster.forEach(function (st) { (S.all[st.id] || []).forEach(function (r) { allFlat.push({ s: st, r: r }); }); });
    function delBlockHTML(st) {
      if (S.delSid !== st.id) {
        return '<p class="note" style="padding:10px 0 4px;text-align:right">' +
          '<button class="barlink" data-delstu="' + esc(st.id) + '">この生徒をアーカイブ</button></p>';

      return '<div class="delbox">' +
        '<p class="delwarn">' + esc(st.name) + 'さんを一覧から非表示にします。記録' + n + '件・大学・共通テスト・テストゼミのデータは消えず、いつでも復元できます。</p>' +
        '<div class="field"><label>確認のため「' + esc(st.name) + '」と入力してください</label>' +
        '<input id="del-name" placeholder="' + esc(st.name) + '" autocomplete="off"></div>' +
        '<div class="row2">' +
          '<button class="btn sm danger" id="del-go">アーカイブする</button>' +
          '<button class="btn sm ghost" id="del-cancel">やめる</button>' +
        '</div>' +
      '</div>';
    }

    if (S.teacherStudent && !S.roster.some(function (st) { return st.id === S.teacherStudent; })) S.teacherStudent = '';
    if (!S.teacherStudent && S.roster.length) S.teacherStudent = S.roster[0].id;

    var tabs = S.roster.map(function (st) {
      var n = (S.all[st.id] || []).length;
      return '<button class="teacher-student-tab" data-tstudent="' + esc(st.id) + '" aria-selected="' + (S.teacherStudent === st.id ? 'true' : 'false') + '">' +
        esc(st.name) + '<small>' + n + '記録</small></button>';
    }).join('');

    var activeStudent = S.roster.filter(function (st) { return st.id === S.teacherStudent; })[0];
    var card = '';
    if (activeStudent) {
      var st = activeStudent;
      var allRecs = S.all[st.id] || [];
      var unis = S.unisAll[st.id] || [];
      var first = unis.filter(function (u) { return (u.kind || 'sub') === 'first'; })[0];
      var firstLabel = first ? uniLabel(first) : '第一志望 未登録';
      var latest = allRecs.slice().sort(function (a, b) { return Number(b.at || 0) - Number(a.at || 0); })[0];
      var latestText = latest ? (latest.date || '日付なし') : 'まだ記録なし';

      var gs = groupByUni(allRecs.slice());
      var labels = {};
      gs.forEach(function (g) { labels[g.label] = true; });
      var savedCt = S.ct, savedUnis = S.unis;
      S.ct = S.ctAll[st.id] || [];
      S.unis = unis;
      gs.forEach(function (g) { g.kind = kindOf(g.label); });
      if (S.ct.length && !labels[CENTER_NAME]) gs.push({ label: CENTER_NAME, recs: [], kind: 'center' });
      S.unis.forEach(function (u) { if (!labels[uniLabel(u)]) gs.push({ label: uniLabel(u), recs: [], kind: u.kind || 'sub' }); });
      gs.sort(function (a, b) { return kindRank(a.kind) - kindRank(b.kind); });
      var detail = gs.length ? gs.map(function (g) {
        return matrixHTML(g.label, g.recs, g.kind) + '<div style="margin:-6px 0 18px"></div>';
      }).join('') : '<div class="teacher-empty-detail">記録はまだありません。</div>';
      S.ct = savedCt; S.unis = savedUnis;

      card = '<div class="teacher-single-card">' +
        '<div class="teacher-single-head">' +
          '<div class="teacher-card-head">' +
            '<div><div class="teacher-card-name">' + esc(st.name) + '</div><div class="teacher-card-school">' + esc(firstLabel) + '</div></div>' +
            '<div class="teacher-last"><span>最終記録</span><b>' + esc(latestText) + '</b></div>' +
          '</div>' +
          '<div class="teacher-metrics">' +
            '<div class="teacher-metric"><b>' + allRecs.length + '</b><span>記録</span></div>' +
            '<div class="teacher-metric teacher-pin-metric"><b>' + esc(st.pin || '未取得') + '</b><span>生徒PIN</span></div>' +
          '</div>' +
          (!st.pin ? '<p class="note" style="margin:8px 0 0">この生徒は旧保存形式です。本人が次回PINでログインすると、ここに4桁PINが表示されます。</p>' : '') +
        '</div>' +
        '<div class="teacher-single-body teacher-readonly">' + detail + delBlockHTML(st) + '</div>' +
      '</div>';
    }

    var archivedBox = S.archived && S.archived.length ? '<details class="card" style="margin-top:14px"><summary style="cursor:pointer;font-weight:800">アーカイブ済みの生徒（' + S.archived.length + '人）</summary><div style="margin-top:10px">' + S.archived.map(function(st){ return '<div class="subj-row"><div>' + esc(st.name) + '</div><div style="display:flex;gap:10px;align-items:center"><button class="barlink" data-restorestu="' + esc(st.id) + '">復元</button><button class="barlink" style="color:#B4232B" data-harddelstu="' + esc(st.id) + '">完全削除</button></div></div>'; }).join('') + '<p class="note" style="margin-top:10px">完全削除すると、その生徒の過去問・共通テスト・大学設定・テストゼミ成績も削除されます。実行前にバックアップを保存します。</p></div></details>' : '';

    var empty = S.roster.length
      ? '<div class="empty">この条件に該当する生徒はいません。</div>'
      : '<div class="empty">生徒がまだ登録されていません。生徒モードから登録してもらってください。</div>';

    return '<div class="wrap teacher-dashboard">' +
      seminarModeTabs('teacher') +
      '<div class="teacher-hero"><div><h2>生徒カルテ</h2><p>上のタブで生徒を切り替えて、記録をそのまま確認できます。</p></div>' +
        '<div class="teacher-mini"><span><b>' + S.roster.length + '</b>人</span><span><b>' + allFlat.length + '</b>記録</span></div></div>' +
      '<div class="teacher-student-tabs">' + tabs + '</div>' +
      '<div class="teacher-students">' + (card || empty) + '</div>' +
      '<div class="teacher-adminline">' +
        '<button class="barlink" id="reload">最新の入力を読み込む</button>' +
        '<button class="barlink" id="csv">CSVで書き出す</button>' +
        '<button class="barlink teacher-manage-link" data-ttab="unis">大学・科目を管理</button>' +
      '</div>' +
      '<div id="csvbox"></div>' +
    '</div>';
  }

  /* ---------- render ---------- */
  function render() {
    if (S.loading) { root.innerHTML = '<div class="boot">読み込み中…</div>'; return; }
    var head = '<div class="hd">' +
      '<h1><span class="mark"></span>過去問の記録</h1>' +
      '<div class="who">' + (S.tab === 'student'
        ? (S.me ? esc(S.me.name) + 'さんとして入力中' : '名前を選んでください')
        : '先生用ダッシュボード') + '</div>' +
      ((!S.me && !S.teacherOk) ? ('<div class="tabs">' +
        '<button data-tab="student" aria-selected="' + (S.tab === 'student') + '">生徒が入力</button>' +
        '<button data-tab="teacher" aria-selected="' + (S.tab === 'teacher') + '">先生が見る</button>' +
      '</div>') : '') + '</div>';
    root.innerHTML = head +
      (S.error ? '<div class="wrap"><div class="err">' + esc(S.error) + '</div></div>' : '') +
      (S.tab === 'student' ? studentView() : teacherView()) +
      (S.toast ? '<div class="toast">' + esc(S.toast) + '</div>' : '');
    bind();
  }
  function flash(m) {
    S.toast = m; render();
    setTimeout(function () { S.toast = ''; render(); }, 1800);
  }
  function on(sel, ev, fn) { var el = root.querySelector(sel); if (el) el[ev] = fn; }

  async function saveQuickScore(opts) {
    opts = opts || {};
    var q = S.quick;
    if (!q || S.quickSaving) return false;
    if (q.score === '') {
      // 既存記録の数字を全部消したら、その記録を削除する。新規の空欄は何もせず閉じる。
      if (q.editAt !== null && q.editAt !== undefined) {
        S.quickSaving = true;
        try {
          var delCur = parse(await sGet('rec:' + S.me.id, true), []);
          delCur = delCur.filter(function (r) { return r.at !== q.editAt; });
          if (!(await sSet('rec:' + S.me.id, JSON.stringify(delCur), true))) throw new Error('x');
          S.myRecs = delCur; S.quick = null; S.quickSaving = false; S.error = '';
          flash('記録を削除しました');
          return true;
        } catch (e) {
          S.quickSaving = false; S.error = '削除できませんでした。もう一度お試しください。'; render(); return false;
        }
      }
      S.quick = null; render(); return false;
    }
    if (isNaN(Number(q.score))) { S.error = '得点を数字で入力してください。'; render(); return false; }
    if (Number(q.score) > Number(q.full)) { S.error = '得点が満点を超えています。'; render(); return false; }
    var rec = {
      univ: q.univ, faculty: q.faculty, year: q.year, subject: q.subject,
      score: Number(q.score), full: Number(q.full), pass: q.pass,
      date: q.date, memo: '', reviewed: !!q.reviewed, at: Date.now()
    };
    S.quickSaving = true;
    try {
      var cur = parse(await sGet('rec:' + S.me.id, true), []);
      if (q.editAt !== null && q.editAt !== undefined) {
        var ix = cur.findIndex(function (r) { return r.at === q.editAt; });
        if (ix >= 0) { rec.at = cur[ix].at; cur[ix] = rec; }
        else cur.push(rec);
      } else cur.push(rec);
      if (!(await sSet('rec:' + S.me.id, JSON.stringify(cur), true))) throw new Error('x');
      S.myRecs = cur; S.quick = null; S.error = '';
      await ensureRegistered(rec);
      S.quickSaving = false;
      flash(q.editAt !== null && q.editAt !== undefined ? '記録を更新しました' : '表から記録しました');
      return true;
    } catch (e) {
      S.quickSaving = false;
      S.error = '保存できませんでした。もう一度お試しください。';
      render();
      return false;
    }
  }

  // 点数入力中に入力枠の外をタップしたら自動保存。既存点数を空欄にして外タップすると削除。×はキャンセル。
  document.addEventListener('pointerdown', function (e) {
    if (!S.quick || S.quickSaving) return;
    var box = root.querySelector('.mx-quick');
    if (!box || box.contains(e.target)) return;
    if (e.target && e.target.closest && e.target.closest('#q-cancel')) return;
    e.preventDefault();
    e.stopPropagation();
    saveQuickScore();
  }, true);

  /* ---------- events ---------- */
  function bind() {
    root.querySelectorAll('[data-tab]').forEach(function (b) {
      b.onclick = async function () {
        S.tab = b.getAttribute('data-tab'); S.error = '';
        if (S.tab === 'teacher' && S.teacherOk) await refreshTeacher();
        render();
      };
    });
    root.querySelectorAll('[data-student-panel]').forEach(function (b) {
      b.onclick = async function () {
        S.studentPanel = b.getAttribute('data-student-panel') || 'past'; S.error = '';
        if (S.studentPanel === 'seminar') await loadSeminar();
        render();
      };
    });
    root.querySelectorAll('[data-teacher-panel]').forEach(function (b) {
      b.onclick = async function () {
        S.teacherPanel = b.getAttribute('data-teacher-panel') || 'past'; S.error = '';
        if (S.teacherPanel === 'seminar') await loadSeminar();
        render();
      };
    });
    root.querySelectorAll('[data-seminar-view]').forEach(function (b) {
      b.onclick = function () {
        S.studentSeminarView = b.getAttribute('data-seminar-view') || 'scores';
        S.error = ''; render();
      };
    });
    root.querySelectorAll('[data-seminar-round]').forEach(function (b) {
      b.onclick = function () { S.seminarRound = Number(b.getAttribute('data-seminar-round')); S.error = ''; render(); };
    });
    root.querySelectorAll('[data-seminar-score]').forEach(function (inp) {
      inp.onchange = async function () {
        var parts = inp.getAttribute('data-seminar-score').split('|');
        var sid = parts[0], part = parts[1], val = inp.value.trim();
        var rr = seminarRoundInfo(S.seminarRound); if (!rr) return;
        var maxVal = part === 'p1' ? Number(rr.full1 || 0) : Number(rr.full2 || 0);
        if (val !== '' && (isNaN(Number(val)) || Number(val) < 0 || Number(val) > maxVal)) { S.error = '正答数は0〜' + maxVal + 'で入力してください。'; render(); return; }
        rr.scores = rr.scores || {}; rr.scores[sid] = rr.scores[sid] || {};
        rr.scores[sid][part] = val === '' ? '' : Number(val);
        await saveSeminar(); S.error = ''; render();
      };
    });

    root.querySelectorAll('[data-stab]').forEach(function (b) {
      b.onclick = function () { S.sTab = b.getAttribute('data-stab'); S.error = ''; render(); };
    });
    root.querySelectorAll('[data-wish]').forEach(function (b) {
      b.onclick = async function () {
        var parts = b.getAttribute('data-wish').split('|');
        var w = parse(await sGet('wish:' + S.me.id, true), {});
        if (parts[1]) w[parts[0]] = parts[1]; else delete w[parts[0]];
        await saveWish(w);
        render();
      };
    });
    root.querySelectorAll('[data-ttab]').forEach(function (b) {
      b.onclick = async function () {
        S.tTab = b.getAttribute('data-ttab'); S.error = ''; S.editUni = null;
        if (S.tTab === 'records') await refreshTeacher();
        render();
      };
    });

    root.querySelectorAll('[data-tfilter]').forEach(function (b) {
      b.onclick = function () {
        S.teacherFilter = b.getAttribute('data-tfilter') || 'all';
        S.error = ''; render();
      };
    });
    on('#teacher-search', 'oninput', function (e) {
      var q = (e.target.value || '').trim().toLowerCase();
      root.querySelectorAll('[data-stucard]').forEach(function (card) {
        var hay = (card.getAttribute('data-search') || '').toLowerCase();
        card.style.display = (!q || hay.indexOf(q) >= 0) ? '' : 'none';
      });
    });

    root.querySelectorAll('[data-tstudent]').forEach(function (b) {
      b.onclick = function () {
        S.teacherStudent = b.getAttribute('data-tstudent') || '';
        S.delSid = '';
        S.error = '';
        render();
      };
    });

    root.querySelectorAll('[data-pick]').forEach(function (b) {
      b.onclick = function () {
        S.authSid = b.getAttribute('data-pick');
        S.error = '';
        render();
        setTimeout(function () { var p = root.querySelector('#student-pin'); if (p) p.focus(); }, 0);
      };
    });

    on('#student-back', 'onclick', function () { S.authSid = ''; S.error = ''; render(); });
    on('#student-login', 'onclick', async function () {
      var st = S.roster.filter(function (x) { return x.id === S.authSid; })[0];
      if (!st) { S.authSid = ''; render(); return; }
      var p1 = (root.querySelector('#student-pin') || {}).value || '';
      if (!validPin(p1)) { S.error = 'PINは4桁の数字で入力してください。'; render(); return; }
      var hp = await hashPin(p1);
      if (!st.pinHash) {
        var p2 = (root.querySelector('#student-pin2') || {}).value || '';
        if (p1 !== p2) { S.error = '2回のPINが一致していません。'; render(); return; }
        var freshPin = parse(await sGet('roster', true), []);
        freshPin = freshPin.map(function (x) { return x.id === st.id ? Object.assign({}, x, { pinHash: hp, pin: p1 }) : x; });
        await sSet('roster', JSON.stringify(freshPin), true);
        S.roster = freshPin; st = freshPin.filter(function (x) { return x.id === st.id; })[0];
      } else if (hp !== st.pinHash) {
        S.error = 'PINが違います。'; render(); return;
      } else if (!st.pin) {
        var rosterWithPin = parse(await sGet('roster', true), []);
        rosterWithPin = rosterWithPin.map(function (x) { return x.id === st.id ? Object.assign({}, x, { pin: p1 }) : x; });
        await sSet('roster', JSON.stringify(rosterWithPin), true);
        S.roster = rosterWithPin;
        st = rosterWithPin.filter(function (x) { return x.id === st.id; })[0] || st;
      }
      S.me = st; S.authSid = ''; S.error = '';
      await sSet('me', st.id, false);
      await loadMyRecs(); await loadCT(); await loadUnis();
      S.form = blankForm(); render();
    });
    on('#student-pin', 'onkeydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var b = root.querySelector('#student-login'); if (b) b.click(); } });
    on('#student-pin2', 'onkeydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var b = root.querySelector('#student-login'); if (b) b.click(); } });

    on('#addme', 'onclick', async function () {
      var el = root.querySelector('#newname');
      var name = (el.value || '').trim();
      var pin1 = ((root.querySelector('#newpin') || {}).value || '').trim();
      var pin2 = ((root.querySelector('#newpin2') || {}).value || '').trim();
      if (!name) { S.error = '名前を入力してください。'; render(); return; }
      if (!validPin(pin1)) { S.error = 'PINは4桁の数字で設定してください。'; render(); return; }
      if (pin1 !== pin2) { S.error = '2回のPINが一致していません。'; render(); return; }
      var fresh = parse(await sGet('roster', true), []);
      if (fresh.some(function (x) { return x.name === name; })) {
        S.error = 'この名前はすでに登録されています。上の一覧から名前を選んでPINを入力してください。'; render(); return;
      }
      var me = { id: 's' + Date.now().toString(36) + Math.floor(Math.random() * 999).toString(36), name: name, pinHash: await hashPin(pin1), pin: pin1 };
      fresh.push(me);
      await sSet('roster', JSON.stringify(fresh), true);
      S.roster = fresh; S.me = me; S.authSid = ''; S.error = '';
      await sSet('me', me.id, false);
      await loadMyRecs(); await loadCT(); await loadUnis();
      S.form = blankForm(); render();
    });

    on('#switchme', 'onclick', async function () {
      await sSet('me', '', false);
      S.me = null; S.authSid = ''; S.myRecs = [];
      await loadRoster(); render();
    });

    on('#open-center', 'onclick', function () {
      S.entryOpen = S.entryOpen === 'center' ? '' : 'center';
      if (S.entryOpen === 'center') {
        S.form = blankForm();
        S.form.uniKey = CENTER_ID; S.form.univ = CENTER_NAME; S.form.faculty = '';
      }
      render();
    });
    on('#open-uni', 'onclick', function () {
      S.entryOpen = S.entryOpen === 'uni' ? '' : 'uni';
      if (S.entryOpen === 'uni') {
        S.form = blankForm();
      }
      render();
    });
    on('#close-entry', 'onclick', function () { S.entryOpen = ''; render(); });

    /* --- student form --- */
    on('#f-uni', 'onchange', function (e) {
      var v = e.target.value;
      S.form.uniKey = v; S.form.subjKey = ''; S.form.subject = '';
      if (v === '__other' || v === '') { S.form.univ = ''; S.form.faculty = ''; }
      else {
        var u = findUni(v);
        if (u) { S.form.univ = u.name; S.form.faculty = u.faculty || ''; }
      }
      render();
    });
    on('#f-subj', 'onchange', function (e) {
      var v = e.target.value;
      S.form.subjKey = v;
      var u = findUni(S.form.uniKey);
      if (v === '__other' || v === '') { S.form.subject = ''; }
      else if (u && u.subjects[Number(v)]) {
        var s = u.subjects[Number(v)];
        S.form.subject = s.name;
        S.form.full = String(s.full);
        S.form.pass = (s.pass === null || s.pass === undefined) ? '' : String(s.pass);
      }
      render();
    });
    [['#f-subj-free', 'subject'], ['#f-univ', 'univ'], ['#f-fac', 'faculty'],
     ['#f-score', 'score'], ['#f-full', 'full'], ['#f-pass', 'pass'],
     ['#f-year', 'year'], ['#f-date', 'date'], ['#f-memo', 'memo']].forEach(function (p) {
      on(p[0], 'oninput', function (e) { S.form[p[1]] = e.target.value; });
    });

    on('#save', 'onclick', async function () {
      var f = S.form, btn = root.querySelector('#save');
      if (!f.univ) { S.error = '大学を選んでください。'; render(); return; }
      if (!f.subject) { S.error = '科目を選んでください。'; render(); return; }
      if (f.score === '' || isNaN(Number(f.score))) { S.error = '得点を入力してください。'; render(); return; }
      if (!Number(f.full)) { S.error = '満点を入力してください。'; render(); return; }
      if (Number(f.score) > Number(f.full)) { S.error = '得点が満点を超えています。'; render(); return; }

      var rec = {
        univ: f.univ, faculty: f.faculty, year: f.year, subject: f.subject,
        score: Number(f.score), full: Number(f.full),
        pass: f.pass === '' ? null : Number(f.pass),
        date: f.date, memo: f.memo, at: Date.now()
      };
      btn.disabled = true; btn.textContent = '保存中…';
      try {
        var cur = parse(await sGet('rec:' + S.me.id, true), []);
        cur.push(rec);
        if (!(await sSet('rec:' + S.me.id, JSON.stringify(cur), true))) throw new Error('x');
        S.myRecs = cur; S.error = '';
        await ensureRegistered(rec);
        S.form = blankForm();
        S.entryOpen = '';
        flash('記録しました');
      } catch (e) {
        S.error = '保存できませんでした。通信を確認してもう一度お試しください。';
        render();
      }
    });

    root.querySelectorAll('[data-mxtoggle]').forEach(function (head) {
      head.onclick = function () {
        var label = head.getAttribute('data-mxtoggle') || '';
        S.mxOpen[label] = !S.mxOpen[label];
        if (!S.mxOpen[label]) {
          if (S.quick && S.quick.label === label) S.quick = null;
          if (S.totalQuick && S.totalQuick.label === label) S.totalQuick = null;
          if (S.targetQuick && S.targetQuick.label === label) S.targetQuick = null;
        }
        render();
      };
    });

    root.querySelectorAll('[data-qopen]').forEach(function (cell) {
      cell.onclick = function () {
        var label = cell.getAttribute('data-qlabel') || '';
        var year = cell.getAttribute('data-qyear') || '';
        var subject = cell.getAttribute('data-qsubject') || '';
        var u = label === CENTER_NAME ? centerUni() : S.unis.filter(function (x) { return uniLabel(x) === label; })[0];
        var sb = u && u.subjects ? u.subjects.filter(function (x) { return x.name === subject; })[0] : null;
        var prev = S.myRecs.filter(function (r) {
          return (r.univ + (r.faculty ? ' ' + r.faculty : '')) === label && r.year === year && r.subject === subject;
        }).slice(-1)[0];
        var d = new Date();
        S.targetQuick = null;
        S.quick = {
          label: label, year: year, subject: subject,
          score: prev ? String(prev.score) : '',
          reviewed: prev ? !!prev.reviewed : false,
          editAt: prev ? prev.at : null,
          univ: u ? u.name : label, faculty: u ? (u.faculty || '') : '',
          full: String(sb ? sb.full : (prev ? prev.full : 100)),
          pass: subjectTarget(u, subject),
          date: prev && prev.date ? prev.date : (d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'))
        };
        render();
        setTimeout(function () {
          var el = root.querySelector('#q-score');
          if (el) { el.focus(); el.select(); }
        }, 0);
      };
    });

    root.querySelectorAll('[data-qsopen]').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var label = b.getAttribute('data-qslabel') || '';
        var subject = b.getAttribute('data-qssubject') || '';
        var u = label === CENTER_NAME ? centerUni() : S.unis.filter(function (x) { return uniLabel(x) === label; })[0];
        if (!u) return;
        var old = subjectTarget(u, subject);
        S.targetQuick = { label: label, subject: subject, value: old === null ? '' : String(old) };
        S.quick = null; S.totalQuick = null;
        render();
        setTimeout(function () { var el = root.querySelector('#qs-target'); if (el) { el.focus(); el.select(); } }, 0);
      };
    });
    on('#qs-target', 'oninput', function (e) { if (S.targetQuick) S.targetQuick.value = e.target.value; });
    on('#qs-target', 'onkeydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); var b = root.querySelector('#qs-save'); if (b) b.click(); }
      if (e.key === 'Escape') { S.targetQuick = null; render(); }
    });
    on('#qs-cancel', 'onclick', function () { S.targetQuick = null; render(); });
    on('#qs-save', 'onclick', async function () {
      var tq = S.targetQuick;
      if (!tq) return;
      if (tq.value === '' || isNaN(Number(tq.value))) { S.error = '目標点を入力してください。'; render(); return; }
      var value = Number(tq.value);
      if (tq.label === CENTER_NAME) {
        var ct = S.ct.map(function (sb) {
          if (sb.name !== tq.subject) return sb;
          return Object.assign({}, sb, { target: value });
        });
        await saveCT(ct);
      } else {
        var fresh = parse(await sGet(unisKey(S.me.id), true), []).map(function (u) {
          if (uniLabel(u) !== tq.label) return u;
          var subjects = (u.subjects || []).map(function (sb) {
            if (sb.name !== tq.subject) return sb;
            return Object.assign({}, sb, { target: value });
          });
          return Object.assign({}, u, { subjects: subjects });
        });
        await sSet(unisKey(S.me.id), JSON.stringify(fresh), true);
        S.unis = fresh;
      }
      S.targetQuick = null; S.error = '';
      flash('目標点を保存しました');
    });

    root.querySelectorAll('[data-tqopen]').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var label = b.getAttribute('data-tqlabel') || '';
        var year = b.getAttribute('data-tqyear') || '';
        var u = S.unis.filter(function (x) { return uniLabel(x) === label; })[0];
        if (!u) return;
        var old = yearlyMinimum(u, year);
        S.totalQuick = { label: label, year: year, uid: u.id, value: old === null ? '' : String(old) };
        S.quick = null; S.targetQuick = null;
        render();
        setTimeout(function () { var el = root.querySelector('#qt-min'); if (el) { el.focus(); el.select(); } }, 0);
      };
    });
    on('#qt-min', 'oninput', function (e) { if (S.totalQuick) S.totalQuick.value = e.target.value; });
    on('#qt-min', 'onkeydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); var b = root.querySelector('#qt-save'); if (b) b.click(); }
      if (e.key === 'Escape') { S.totalQuick = null; render(); }
    });
    on('#qt-cancel', 'onclick', function () { S.totalQuick = null; render(); });
    on('#qt-save', 'onclick', async function () {
      var tq = S.totalQuick;
      if (!tq) return;
      if (tq.value === '' || isNaN(Number(tq.value))) { S.error = '合格最低点を入力してください。'; render(); return; }
      var fresh = parse(await sGet(unisKey(S.me.id), true), []).map(function (u) {
        if (u.id !== tq.uid) return u;
        var mins = Object.assign({}, u.minimums || {});
        mins[String(tq.year)] = Number(tq.value);
        return Object.assign({}, u, { minimums: mins });
      });
      await sSet(unisKey(S.me.id), JSON.stringify(fresh), true);
      S.unis = fresh; S.totalQuick = null; S.error = '';
      flash('合格最低点を保存しました');
    });

    on('#q-score', 'oninput', function (e) { if (S.quick) S.quick.score = e.target.value; });
    on('#q-reviewed', 'onchange', function (e) { if (S.quick) S.quick.reviewed = !!e.target.checked; });
    on('#q-score', 'onkeydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); saveQuickScore(); }
      if (e.key === 'Escape') { S.quick = null; render(); }
    });
    on('#q-cancel', 'onclick', function () { S.quick = null; render(); });

    root.querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = async function () {
        var i = Number(b.getAttribute('data-del'));
        var cur = parse(await sGet('rec:' + S.me.id, true), []);
        cur.splice(i, 1);
        await sSet('rec:' + S.me.id, JSON.stringify(cur), true);
        S.myRecs = cur; flash('削除しました');
      };
    });

    var cw = root.querySelector('#ctwrap');
    if (cw) cw.ontoggle = function () { S.openCT = cw.open; };

    on('#ct-save', 'onclick', async function () {
      var subs = [];
      root.querySelectorAll('[data-ct]').forEach(function (box) {
        if (!box.checked) return;
        var i = Number(box.getAttribute('data-ct'));
        var old = S.ct.filter(function (x) { return x.name === CT_SUBJECTS[i][0]; })[0];
        subs.push({ name: CT_SUBJECTS[i][0], full: CT_SUBJECTS[i][1], targets: old && old.targets ? Object.assign({}, old.targets) : {} });
      });
      if (!subs.length) { S.error = '科目を1つ以上選んでください。'; render(); return; }
      await saveCT(subs);
      S.openCT = false; S.error = '';
      flash('共通テストの科目を決めました');
    });

    root.querySelectorAll('[data-ct], [data-us]').forEach(function (box) {
      box.onchange = function () {
        var row = box.closest('.ctrow');
        if (row) row.className = 'ctrow' + (box.checked ? ' on' : '');
      };
    });

    /* --- pin --- */
    on('#pinok', 'onclick', async function () {
      var val = (root.querySelector('#pin').value || '').trim();
      if (val.length < 4) { S.error = '4桁以上で入力してください。'; render(); return; }
      var saved = await sGet('teacher-pin', true);
      if (!saved) { await sSet('teacher-pin', val, true); S.pinExists = true; }
      else if (saved !== val) { S.error = '暗証番号が違います。'; render(); return; }
      S.teacherOk = true; S.error = '';
      await refreshTeacher();
    });

    on('#rs-open', 'onclick', function () { S.resetting = true; S.error = ''; render(); });
    on('#rs-cancel', 'onclick', function () { S.resetting = false; S.error = ''; render(); });
    on('#rs-go', 'onclick', async function () {
      var word = (root.querySelector('#rs-word').value || '').trim();
      var np = (root.querySelector('#rs-pin').value || '').trim();
      if (word !== 'リセット') { S.error = '「リセット」と入力してください。'; render(); return; }
      if (np.length < 4) { S.error = '新しい暗証番号は4桁以上で入力してください。'; render(); return; }
      await sSet('teacher-pin', np, true);
      S.pinExists = true; S.resetting = false; S.teacherOk = true; S.error = '';
      await refreshTeacher();
      flash('暗証番号を変更しました');
    });

    /* --- universities --- */
    on('#n-add', 'onclick', async function () {
      var name = (root.querySelector('#n-name').value || '').trim();
      var fac = (root.querySelector('#n-fac').value || '').trim();
      var text = root.querySelector('#n-text').value || '';
      if (!name) { S.error = '大学名を入力してください。'; render(); return; }
      if (!S.editSid) { S.error = '先に生徒を選んでください。'; render(); return; }
      var fresh = parse(await sGet(unisKey(S.editSid), true), []);
      var dup = fresh.filter(function (u) { return u.name === name && (u.faculty || '') === fac; })[0];
      if (dup) {
        S.error = esc(uniLabel(dup)) + ' はすでに登録されています。一覧から選んでください。';
        S.unis = fresh; render(); return;
      }
      var nu = {
        id: 'u' + Date.now().toString(36) + Math.floor(Math.random() * 999).toString(36),
        name: name, faculty: fac, kind: (root.querySelector('#n-kind') || {}).value || 'sub',
        target: (root.querySelector('#n-target') && root.querySelector('#n-target').value !== '') ? Number(root.querySelector('#n-target').value) : null,
        minimums: {},
        subjects: readSubjectPicker('n')
      };
      fresh.push(nu);
      await saveUnis(fresh);
      S.error = '';
      if (S.tab === 'student' && S.form) {
        S.form.uniKey = nu.id; S.form.univ = nu.name; S.form.faculty = nu.faculty;
        S.form.subjKey = ''; S.form.subject = '';
      }
      flash('登録しました');
    });


    root.querySelectorAll('[data-edit]').forEach(function (b) {
      b.onclick = function () {
        var u = findUni(b.getAttribute('data-edit'));
        if (!u) return;
        S.editUni = u.id;
        S.draft = { name: u.name, faculty: u.faculty || '', kind: u.kind || 'sub', target: u.target == null ? '' : u.target, subjects: (u.subjects || []).slice() };
        render();
      };
    });
    on('#e-cancel', 'onclick', function () { S.editUni = null; render(); });
    on('#e-save', 'onclick', async function () {
      await safetyBackup('大学・科目編集前', S.editSid);
      var name = (root.querySelector('#e-name').value || '').trim();
      if (!name) { S.error = '大学名を入力してください。'; render(); return; }
      var fac = (root.querySelector('#e-fac').value || '').trim();
      var text = root.querySelector('#e-text').value || '';
      var fresh = parse(await sGet(unisKey(S.editSid), true), []);
      fresh = fresh.map(function (u) {
        if (u.id !== S.editUni) return u;
        return { id: u.id, name: name, faculty: fac,
          kind: (root.querySelector('#e-kind') || {}).value || 'sub',
          target: (root.querySelector('#e-target') && root.querySelector('#e-target').value !== '') ? Number(root.querySelector('#e-target').value) : null,
          minimums: u.minimums || {},
          subjects: readSubjectPicker('e') };
      });
      await saveUnis(fresh);
      S.editUni = null; S.error = '';
      flash('保存しました');
    });
    root.querySelectorAll('[data-rmuni]').forEach(function (b) {
      b.onclick = async function () {
        var id = b.getAttribute('data-rmuni');
        var word = root.querySelector('#rmuni-word');
        if (word && word.value.trim() !== '削除') { S.error = '確認欄に「削除」と入力してください。'; render(); return; }
        await safetyBackup('大学削除前', S.editSid);
        var gone = findUni(id);
        var fresh = parse(await sGet(unisKey(S.editSid), true), []).filter(function (u) { return u.id !== id; });
        await saveUnis(fresh);
        if (gone) {
          var recs = parse(await sGet('rec:' + S.editSid, true), []).filter(function (r) {
            return !(r.univ === gone.name && (r.faculty || '') === (gone.faculty || ''));
          });
          await sSet('rec:' + S.editSid, JSON.stringify(recs), true);
          if (S.me && S.editSid === S.me.id) S.myRecs = recs;
        }
        S.delUid = '';
        if (S.tab === 'teacher') await refreshTeacher();
        flash('削除しました');
      };
    });
    root.querySelectorAll('[data-delu]').forEach(function (b) {
      b.onclick = function () { S.delUid = b.getAttribute('data-delu'); render(); };
    });
    on('#rmuni-cancel', 'onclick', function () { S.delUid = ''; render(); });
    root.querySelectorAll('[data-kind]').forEach(function (b) {
      b.onclick = async function () {
        var pr = b.getAttribute('data-kind').split('|');
        var fresh = parse(await sGet(unisKey(S.editSid), true), []).map(function (u) {
          return u.id === pr[0] ? Object.assign({}, u, { kind: pr[1] }) : u;
        });
        await saveUnis(fresh);
        render();
      };
    });
    on('#usel', 'onchange', async function (e) {
      S.uniSid = e.target.value; S.editUni = null; S.error = '';
      await loadUnis(S.uniSid);
      render();
    });

    root.querySelectorAll('[data-delstu]').forEach(function (b) {
      b.onclick = function (e) {
        e.preventDefault();
        S.delSid = b.getAttribute('data-delstu'); S.error = ''; render();
      };
    });
    on('#del-cancel', 'onclick', function () { S.delSid = ''; S.error = ''; render(); });
    on('#del-go', 'onclick', async function () {
      var s2 = S.roster.filter(function (x) { return x.id === S.delSid; })[0];
      if (!s2) { S.delSid = ''; render(); return; }
      var typed = (root.querySelector('#del-name').value || '').trim();
      if (typed !== s2.name) { S.error = '名前が一致しません。「' + s2.name + '」と入力してください。'; render(); return; }
      await safetyBackup('生徒アーカイブ前', s2.id);
      var fresh = parse(await sGet('roster', true), []).filter(function (x) { return x.id !== s2.id; });
      var archived = parse(await sGet('archived-roster', true), []);
      if (!archived.some(function(x){ return x.id === s2.id; })) archived.push(s2);
      await sSet('roster', JSON.stringify(fresh), true);
      await sSet('archived-roster', JSON.stringify(archived), true);
      S.delSid = ''; S.error = '';
      await refreshTeacher();
      flash(s2.name + 'さんをアーカイブしました');
    });

    root.querySelectorAll('[data-restorestu]').forEach(function (b) {
      b.onclick = async function () {
        var id = b.getAttribute('data-restorestu');
        var archived = parse(await sGet('archived-roster', true), []);
        var st = archived.filter(function(x){ return x.id === id; })[0];
        if (!st) return;
        await safetyBackup('生徒復元前', id);
        var fresh = parse(await sGet('roster', true), []);
        if (!fresh.some(function(x){ return x.id === id; })) fresh.push(st);
        archived = archived.filter(function(x){ return x.id !== id; });
        await sSet('roster', JSON.stringify(fresh), true);
        await sSet('archived-roster', JSON.stringify(archived), true);
        await refreshTeacher();
        flash(st.name + 'さんを復元しました');
      };
    });


    root.querySelectorAll('[data-harddelstu]').forEach(function (b) {
      b.onclick = async function () {
        var id = b.getAttribute('data-harddelstu');
        var archived = parse(await sGet('archived-roster', true), []);
        var st = archived.filter(function(x){ return x.id === id; })[0];
        if (!st) return;
        if (!confirm(st.name + 'さんを完全削除します。\n\n過去問・共通テスト・大学設定・テストゼミ成績も削除されます。\nこの操作は画面上からは元に戻せません。')) return;
        var typed = prompt('確認のため「' + st.name + '」と入力してください。');
        if (typed === null) return;
        if (typed.trim() !== st.name) { S.error = '名前が一致しないため、完全削除を中止しました。'; render(); return; }
        await safetyBackup('生徒完全削除前', id);
        try { await window.storage.delete('rec:' + id, true); } catch (e) {}
        try { await window.storage.delete('ct:' + id, true); } catch (e) {}
        try { await window.storage.delete(unisKey(id), true); } catch (e) {}
        try { await window.storage.delete('wish:' + id, true); } catch (e) {}
        var sem = parse(await sGet('seminar', true), []);
        sem.forEach(function(rr){ if (rr.scores && Object.prototype.hasOwnProperty.call(rr.scores, id)) delete rr.scores[id]; });
        await sSet('seminar', JSON.stringify(sem), true);
        archived = archived.filter(function(x){ return x.id !== id; });
        await sSet('archived-roster', JSON.stringify(archived), true);
        S.error = '';
        await refreshTeacher();
        flash(st.name + 'さんを完全削除しました');
      };
    });

    on('#seed', 'onclick', seedSample);
    on('#unseed', 'onclick', clearSample);

    /* --- dashboard --- */
    on('#uf', 'onchange', function (e) { S.filter = e.target.value; render(); });
    on('#reload', 'onclick', async function () { await refreshTeacher(); flash('最新にしました'); });
    on('#csv', 'onclick', function () {
      var rows = [['生徒', '大学', '学部', '年度', '科目', '得点', '満点', '得点率%', '目標点', '差', '実施日', 'メモ']];
      S.roster.forEach(function (s) {
        (S.all[s.id] || []).forEach(function (r) {
          rows.push([s.name, r.univ, r.faculty, r.year, r.subject, r.score, r.full,
            pct(r), r.pass === null ? '' : r.pass, diff(r) === null ? '' : diff(r), r.date, r.memo]);
        });
      });
      var text = rows.map(function (row) {
        return row.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
      }).join('\n');
      root.querySelector('#csvbox').innerHTML =
        '<div class="field" style="margin-top:10px"><label>コピーしてスプレッドシートに貼り付けてください</label>' +
        '<textarea class="csv" id="csvta"></textarea></div>';
      var ta = root.querySelector('#csvta');
      ta.value = text; ta.focus(); ta.select();
    });
  }

  async function refreshTeacher() {
    if (window.storage.refresh) { try { await window.storage.refresh(); } catch (e) {} }
    await loadRoster(); await loadAll(); await loadSeminar();
    if (S.uniSid) await loadUnis(S.uniSid);
    render();
  }

  (async function init() {
    try {
      await loadRoster(); await loadMe(); await loadMyRecs(); await loadCT(); await loadUnis(); await loadSeminar();
      S.pinExists = !!(await sGet('teacher-pin', true));
    } catch (e) {
      S.error = 'データを読み込めませんでした。ページを開き直してください。';
    }
    S.form = blankForm();
    S.loading = false;
    render();
  })();
})();
</script>
</body>
</html>
